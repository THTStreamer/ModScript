plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.124'
}

version = '1.0.0'
group = 'com.modscript'

base {
    archivesName = 'modscript'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.248'

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        modscript {
            sourceSet sourceSets.main
        }
    }
}

jar {
    manifest {
        attributes(
            'Specification-Title': 'modscript',
            'Specification-Vendor': 'ModScript',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'ModScript',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'FML-Mod': 'modscript',
            'NeoForge-Version': project.neoForge.version
        )
    }
}
